[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sitepulsar-mcp"
version = "0.1.0"
description = "Stdio launcher for the SitePulsar hosted MCP server — AEO (Agent Experience Optimization) audits measuring how findable, readable, and usable a site is to AI answer engines and autonomous AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Gijs van Bueren / SitePulsar", email = "info@sitepulsar.ai" },
]
keywords = [
  "mcp",
  "model-context-protocol",
  "ai-agents",
  "agent-infrastructure",
  "agent-readiness",
  "aeo",
  "ai-visibility",
  "answer-engine-optimization",
  "claude",
  "anthropic",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://www.sitepulsar.ai"
Repository = "https://github.com/SitePulsar/mcp-server"
Documentation = "https://www.sitepulsar.ai/llms.txt"
"Bug Tracker" = "https://github.com/SitePulsar/mcp-server/issues"

[project.scripts]
sitepulsar-mcp = "sitepulsar_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["sitepulsar_mcp"]
